<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>Kişisel AI Ajanı</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#111827}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0001}h1{margin:6px 0 2px}#chat{min-height:55vh;max-height:62vh;overflow:auto}.m{padding:12px;border-radius:14px;margin:8px 0;white-space:pre-wrap}.u{background:#e0e7ff;margin-left:35px}.a{background:#f3f4f6;margin-right:35px}.row{display:flex;gap:8px}input,button{font-size:16px;padding:13px;border-radius:12px;border:1px solid #ddd}input{flex:1}button{background:#111827;color:white}small{color:#6b7280}</style></head><body><main><div class="card"><h1>🤖 Kişisel AI Ajanı</h1><small>Notlar • görevler • hatırlatıcılar • hafıza • web</small></div><div id="chat" class="card"></div><div class="card"><div class="row"><input id="msg" placeholder="Ne yapmamı istiyorsun?"><button id="mic">🎙️</button><button id="send">Gönder</button></div></div></main><script>
const key=sessionStorage.getItem("agent_key")||prompt("Ajan erişim kodunu gir:");if(key)sessionStorage.setItem("agent_key",key);
const auth=()=>({Authorization:"Bearer "+(sessionStorage.getItem("agent_key")||"")});
const chat=document.querySelector("#chat"),msg=document.querySelector("#msg");
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight}
async function send(){const v=msg.value.trim();if(!v)return;msg.value="";add(v,"u");try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",...auth()},body:JSON.stringify({message:v})});const j=await r.json();if(!r.ok)throw Error(j.error||"Hata");add(j.reply,"a");}catch(e){add("Hata: "+e.message,"a")}}
document.querySelector("#send").onclick=send;msg.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const s=new SR();s.lang="tr-TR";document.querySelector("#mic").onclick=()=>s.start();s.onresult=e=>{msg.value=e.results[0][0].transcript;send()}}else document.querySelector("#mic").disabled=true;
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
